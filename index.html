<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Klinika ni San Nicolas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f2f5; }
.card { padding:20px; width:350px; }
</style>
</head>
<body>

<div class="card">
<h3 class="text-center mb-3">Login</h3>
<div class="mb-3">
<input type="email" id="email" class="form-control" placeholder="Email">
</div>
<div class="mb-3">
<input type="password" id="password" class="form-control" placeholder="Password">
</div>
<button id="loginBtn" class="btn btn-primary w-100">Login</button>
<div id="loginAlert" class="alert alert-danger mt-3 text-center" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
  authDomain: "klinika-ni-san-nicolas.firebaseapp.com",
  projectId: "klinika-ni-san-nicolas",
  storageBucket: "klinika-ni-san-nicolas.firebasestorage.app",
  messagingSenderId: "247172585082",
  appId: "1:247172585082:web:231c83f07b83767e840dc3",
  measurementId: "G-V3PHE6KYDF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// --- Redirect if already logged in ---
onAuthStateChanged(auth, user => {
  if(user) window.location.href = "main.html";
});

// --- Login button ---
document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const alertBox = document.getElementById("loginAlert");
  alertBox.style.display = "none";

  if(!email || !password){
    alertBox.textContent = "Please enter email and password.";
    alertBox.style.display = "block";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "main.html";
  } catch(e){
    alertBox.textContent = "Login failed. Check email/password.";
    alertBox.style.display = "block";
  }
});
</script>
</body>
</html>
