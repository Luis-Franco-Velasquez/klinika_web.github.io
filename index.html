<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Klinika ni San Nicolas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { display:flex; align-items:center; justify-content:center; height:100vh; background:#f0f0f0; }
.login-container { width:350px; padding:30px; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2);}
</style>
</head>
<body>

<div class="login-container">
<h3 class="text-center mb-3">Login</h3>
<div class="mb-3">
<input type="email" id="email" class="form-control" placeholder="Email">
</div>
<div class="mb-3">
<input type="password" id="password" class="form-control" placeholder="Password">
</div>
<div class="d-grid gap-2">
<button class="btn btn-primary" onclick="login()">Login</button>
</div>
<div id="loginAlert" class="alert alert-danger mt-2" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Firebase Config
const firebaseConfig = {
  apiKey:"AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
  authDomain:"klinika-ni-san-nicolas.firebaseapp.com",
  projectId:"klinika-ni-san-nicolas",
  storageBucket:"klinika-ni-san-nicolas.firebasestorage.app",
  messagingSenderId:"247172585082",
  appId:"1:247172585082:web:231c83f07b83767e840dc3",
  measurementId:"G-V3PHE6KYDF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Redirect if already logged in
onAuthStateChanged(auth,user=>{
    if(user) window.location.href="main.html";
});

// Login function
window.login = async function(){
    const email=document.getElementById("email").value.trim();
    const pass=document.getElementById("password").value.trim();
    const alertBox=document.getElementById("loginAlert");
    try{
        await signInWithEmailAndPassword(auth,email,pass);
        window.location.href="main.html";
    } catch(err){
        alertBox.style.display="block";
        alertBox.textContent="Login failed: "+err.message;
    }
}
</script>

</body>
</html>
