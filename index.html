<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Klinika ni San Nicolas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary-color: #4f46e5;
  --primary-hover: #4338ca;
  --secondary-color: #06b6d4;
  --error-color: #ef4444;
  --success-color: #10b981;
  --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg-gradient);
  position: relative;
  overflow: hidden;
}

/* Animated Background Shapes */
.bg-shapes {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 0;
  overflow: hidden;
}

.shape {
  position: absolute;
  filter: blur(50px);
  opacity: 0.5;
  animation: float 20s infinite;
}

.shape-1 {
  width: 400px;
  height: 400px;
  background: #ff6b6b;
  border-radius: 50%;
  top: -200px;
  left: -200px;
  animation-delay: 0s;
}

.shape-2 {
  width: 300px;
  height: 300px;
  background: #4ecdc4;
  border-radius: 50%;
  bottom: -150px;
  right: -150px;
  animation-delay: 5s;
}

.shape-3 {
  width: 250px;
  height: 250px;
  background: #ffe66d;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  animation-delay: 10s;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -50px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}

/* Glassmorphism Card */
.login-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.login-card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: slideUp 0.6s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Logo/Brand Section */
.brand-section {
  text-align: center;
  margin-bottom: 30px;
}

.logo-icon {
  width: 80px;
  height: 80px;
  background: var(--bg-gradient);
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.logo-icon i {
  font-size: 40px;
  color: white;
}

.brand-title {
  font-size: 1.75rem;
  font-weight: 700;
  color: #1f2937;
  margin-bottom: 8px;
}

.brand-subtitle {
  color: #6b7280;
  font-size: 0.95rem;
}

/* Form Styling */
.form-floating {
  position: relative;
  margin-bottom: 20px;
}

.form-floating > .form-control {
  height: 60px;
  padding: 1rem 1rem 1rem 3rem;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.3s ease;
}

.form-floating > .form-control:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
}

.form-floating > label {
  padding: 1rem 1rem 1rem 3rem;
  color: #9ca3af;
}

.input-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  font-size: 1.25rem;
  z-index: 10;
  transition: color 0.3s;
}

.form-floating > .form-control:focus ~ .input-icon {
  color: var(--primary-color);
}

/* Password Toggle */
.password-toggle {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #9ca3af;
  cursor: pointer;
  z-index: 10;
  padding: 0;
  font-size: 1.25rem;
  transition: color 0.3s;
}

.password-toggle:hover {
  color: var(--primary-color);
}

/* Login Button */
.btn-login {
  width: 100%;
  height: 56px;
  background: var(--bg-gradient);
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: 600;
  font-size: 1.1rem;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  margin-top: 10px;
}

.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-login:active {
  transform: translateY(0);
}

.btn-login:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.btn-login .spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 10px;
}

.btn-login.loading .spinner {
  display: inline-block;
}

.btn-login.loading .btn-text {
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Alert Styling */
.alert-custom {
  border-radius: 12px;
  padding: 16px;
  margin-top: 20px;
  display: none;
  animation: shake 0.5s ease-in-out;
  border: none;
}

.alert-custom.show {
  display: flex;
  align-items: center;
  gap: 12px;
}

.alert-danger-custom {
  background: #fef2f2;
  color: var(--error-color);
  border-left: 4px solid var(--error-color);
}

.alert-success-custom {
  background: #ecfdf5;
  color: var(--success-color);
  border-left: 4px solid var(--success-color);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

/* Remember Me & Forgot Password */
.extras {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 0.9rem;
}

.form-check-input {
  width: 1.2em;
  height: 1.2em;
  border-radius: 6px;
  border: 2px solid #d1d5db;
  cursor: pointer;
}

.form-check-input:checked {
  background-color: var(--primary-color);
  border-color: var(--primary-color);
}

.forgot-link {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s;
}

.forgot-link:hover {
  color: var(--primary-hover);
  text-decoration: underline;
}

/* Footer */
.login-footer {
  text-align: center;
  margin-top: 30px;
  color: #6b7280;
  font-size: 0.9rem;
}

.divider {
  display: flex;
  align-items: center;
  margin: 25px 0;
  color: #9ca3af;
  font-size: 0.85rem;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e5e7eb;
}

.divider span {
  padding: 0 15px;
}

/* Social Login (Optional) */
.social-login {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.social-btn {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  border: 2px solid #e5e7eb;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  color: #6b7280;
  font-size: 1.25rem;
}

.social-btn:hover {
  border-color: var(--primary-color);
  color: var(--primary-color);
  transform: translateY(-2px);
}

/* Responsive */
@media (max-width: 480px) {
  .login-card {
    padding: 30px 20px;
    border-radius: 20px;
  }
  
  .brand-title {
    font-size: 1.5rem;
  }
  
  .shape {
    display: none;
  }
}

/* Loading Overlay */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(5px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  flex-direction: column;
  gap: 20px;
}

.loading-overlay.show {
  display: flex;
}

.spinner-large {
  width: 60px;
  height: 60px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
</style>
</head>
<body>

<!-- Background Shapes -->
<div class="bg-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner-large"></div>
  <p class="text-muted">Authenticating...</p>
</div>

<!-- Login Container -->
<div class="login-container">
  <div class="login-card">
    
    <!-- Brand Section -->
    <div class="brand-section">
      <div class="logo-icon">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <h1 class="brand-title">Klinika ni San Nicolas</h1>
      <p class="brand-subtitle">Medical Mission Management System</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      
      <!-- Email Input -->
      <div class="form-floating">
        <i class="bi bi-envelope input-icon"></i>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
        <label for="email">Email address</label>
      </div>

      <!-- Password Input -->
      <div class="form-floating">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
        <label for="password">Password</label>
        <button type="button" class="password-toggle" id="togglePassword" title="Show/Hide Password">
          <i class="bi bi-eye-slash"></i>
        </button>
      </div>

      <!-- Extras -->
      <div class="extras">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label text-muted" for="rememberMe">
            Remember me
          </label>
        </div>
        <a href="#" class="forgot-link" onclick="showForgotPassword()">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn btn-login" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </span>
      </button>

      <!-- Alert Box -->
      <div id="loginAlert" class="alert-custom alert-danger-custom">
        <i class="bi bi-exclamation-circle-fill fs-5"></i>
        <span id="alertMessage">Please enter email and password.</span>
      </div>

    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or continue with</span>
    </div>

    <!-- Social Login -->
    <div class="social-login">
      <button class="social-btn" onclick="socialLogin('google')" title="Google">
        <i class="bi bi-google"></i>
      </button>
      <button class="social-btn" onclick="socialLogin('facebook')" title="Facebook">
        <i class="bi bi-facebook"></i>
      </button>
      <button class="social-btn" onclick="socialLogin('microsoft')" title="Microsoft">
        <i class="bi bi-microsoft"></i>
      </button>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p class="mb-0">Protected by industry-standard encryption</p>
      <small class="text-muted"><i class="bi bi-shield-check me-1"></i>Secure Connection</small>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
  authDomain: "klinika-ni-san-nicolas.firebaseapp.com",
  projectId: "klinika-ni-san-nicolas",
  storageBucket: "klinika-ni-san-nicolas.appspot.com",
  messagingSenderId: "247172585082",
  appId: "1:247172585082:web:231c83f07b83767e840dc3",
  measurementId: "G-V3PHE6KYDF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// DOM Elements
const loginForm = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const alertBox = document.getElementById('loginAlert');
const alertMessage = document.getElementById('alertMessage');
const togglePassword = document.getElementById('togglePassword');
const rememberMe = document.getElementById('rememberMe');
const loadingOverlay = document.getElementById('loadingOverlay');

// Check for remembered email
const rememberedEmail = localStorage.getItem('rememberedEmail');
if (rememberedEmail) {
  emailInput.value = rememberedEmail;
  rememberMe.checked = true;
}

// Toggle Password Visibility
togglePassword.addEventListener('click', () => {
  const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);
  togglePassword.innerHTML = type === 'password' ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
});

// Form Submission
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  
  // Validation
  if (!email || !password) {
    showAlert('Please enter both email and password.', 'error');
    return;
  }
  
  if (!isValidEmail(email)) {
    showAlert('Please enter a valid email address.', 'error');
    return;
  }
  
  // Set persistence based on remember me
  try {
    await setPersistence(auth, rememberMe.checked ? browserLocalPersistence : browserSessionPersistence);
  } catch (e) {
    console.error('Persistence error:', e);
  }
  
  // Show loading
  setLoading(true);
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
    
    // Save email if remember me is checked
    if (rememberMe.checked) {
      localStorage.setItem('rememberedEmail', email);
    } else {
      localStorage.removeItem('rememberedEmail');
    }
    
    showAlert('Login successful! Redirecting...', 'success');
    
    setTimeout(() => {
      window.location.href = "main.html";
    }, 800);
    
  } catch (error) {
    setLoading(false);
    console.error('Login error:', error);
    
    let message = 'Login failed. Please check your credentials.';
    
    switch (error.code) {
      case 'auth/invalid-email':
        message = 'Invalid email address format.';
        break;
      case 'auth/user-disabled':
        message = 'This account has been disabled.';
        break;
      case 'auth/user-not-found':
        message = 'No account found with this email.';
        break;
      case 'auth/wrong-password':
        message = 'Incorrect password. Please try again.';
        break;
      case 'auth/too-many-requests':
        message = 'Too many failed attempts. Please try again later.';
        break;
      case 'auth/network-request-failed':
        message = 'Network error. Please check your connection.';
        break;
    }
    
    showAlert(message, 'error');
  }
});

// Social Login
window.socialLogin = async (provider) => {
  if (provider === 'google') {
    try {
      setLoading(true);
      const googleProvider = new GoogleAuthProvider();
      await signInWithPopup(auth, googleProvider);
      window.location.href = "main.html";
    } catch (error) {
      setLoading(false);
      showAlert('Google sign-in failed: ' + error.message, 'error');
    }
  } else {
    showAlert(`${provider} login coming soon!`, 'info');
  }
};

// Forgot Password
window.showForgotPassword = () => {
  const email = emailInput.value.trim();
  if (!email) {
    showAlert('Please enter your email address first.', 'error');
    emailInput.focus();
    return;
  }
  showAlert('Password reset link would be sent to: ' + email, 'info');
  // Implement actual password reset logic here
  // sendPasswordResetEmail(auth, email);
};

// Helper Functions
function showAlert(message, type = 'error') {
  alertMessage.textContent = message;
  alertBox.className = 'alert-custom show ' + (type === 'success' ? 'alert-success-custom' : type === 'info' ? 'alert-info-custom' : 'alert-danger-custom');
  
  // Auto-hide after 5 seconds for success
  if (type === 'success') {
    setTimeout(() => {
      alertBox.classList.remove('show');
    }, 5000);
  }
}

function setLoading(isLoading) {
  if (isLoading) {
    loginBtn.classList.add('loading');
    loginBtn.disabled = true;
    loadingOverlay.classList.add('show');
  } else {
    loginBtn.classList.remove('loading');
    loginBtn.disabled = false;
    loadingOverlay.classList.remove('show');
  }
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Check auth state
onAuthStateChanged(auth, (user) => {
  if (user) {
    loadingOverlay.classList.add('show');
    window.location.href = "main.html";
  }
});

// Enter key support for password field
passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    loginForm.dispatchEvent(new Event('submit'));
  }
});
</script>

</body>
</html>
