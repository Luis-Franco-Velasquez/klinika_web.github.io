<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinika ni San Nicolas Patient Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f6f9;
        }

        h2 {
            text-align: center;
        }

        input, select {
            padding: 8px;
            margin: 5px;
            width: 16%;
        }

        button {
            padding: 8px 15px;
            background: #2e86de;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background: #2e86de;
            color: white;
        }

        .delete-btn {
            background: red;
        }

        .edit-btn {
            background: orange;
        }

        .filter-search {
            margin-top: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h2>KLINIKA NI SAN NICOLAS PATIENT RECORDS</h2>

    <!-- FORM -->
    <input type="date" id="date">
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="address" placeholder="Address">
    <input type="number" id="ageYears" placeholder="Years" min="0">
    <input type="number" id="ageMonths" placeholder="Months" min="0" max="11">
    <input type="text" id="contact" placeholder="Contact">
    <input type="text" id="sick" placeholder="Sickness (Optional)">
    <input type="text" id="doctorName" placeholder="Doctor Name">
    <select id="doctorType">
        <option value="">Select Type</option>
        <option value="Pedia">Pedia</option>
        <option value="Adult">Adult</option>
    </select>
    <button onclick="addPatient()">Add Record</button>

    <!-- FILTER & SEARCH -->
    <div class="filter-search">
        <input type="text" id="searchInput" placeholder="Search by Name or Date" oninput="renderFiltered()">
        <select id="filterType" onchange="renderFiltered()">
            <option value="">All Doctors</option>
            <option value="Pedia">Pedia</option>
            <option value="Adult">Adult</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Address</th>
                <th>Age</th>
                <th>Contact</th>
                <th>Sickness</th>
                <th>Doctor</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="patientTable"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
            authDomain: "klinika-ni-san-nicolas.firebaseapp.com",
            projectId: "klinika-ni-san-nicolas",
            storageBucket: "klinika-ni-san-nicolas.firebasestorage.app",
            messagingSenderId: "247172585082",
            appId: "1:247172585082:web:231c83f07b83767e840dc3",
            measurementId: "G-V3PHE6KYDF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const table = document.getElementById("patientTable");

        let editId = null;
        let patientsData = []; // Keep all patients locally for search/filter

        // ================= ADD / UPDATE =================
        window.addPatient = async function () {
            const years = document.getElementById("ageYears").value;
            const months = document.getElementById("ageMonths").value;
            const doctorName = document.getElementById("doctorName").value;
            const doctorType = document.getElementById("doctorType").value;

            const patient = {
                date: document.getElementById("date").value,
                name: document.getElementById("name").value,
                address: document.getElementById("address").value,
                age: years + " yr " + months + " mo",
                contact: document.getElementById("contact").value,
                sick: document.getElementById("sick").value,
                doctorName: doctorName,
                doctorType: doctorType
            };

            if (!patient.date || !patient.name || !patient.address || !years || !months || !patient.contact || !doctorName || !doctorType) {
                alert("Please fill all required fields including doctor info");
                return;
            }

            try {
                if (editId) {
                    if (confirm("Are you sure you want to update this record?")) {
                        await updateDoc(doc(db, "patients", editId), patient);
                        editId = null;
                    }
                } else {
                    await addDoc(collection(db, "patients"), patient);
                }
                document.querySelectorAll("input, select").forEach(input => input.value = "");
                document.getElementById("doctorType").value = "";
            } catch (error) {
                console.error("Error adding/updating patient:", error);
                alert("Failed. Check console for errors.");
            }
        };

        // ================= DISPLAY =================
        onSnapshot(collection(db, "patients"), (snapshot) => {
            patientsData = []; // Reset
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                patientsData.push({ id: docSnap.id, ...data });
            });
            renderFiltered();
        });

        // ================= RENDER FILTERED / SEARCH =================
        function renderFiltered() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const filter = document.getElementById("filterType").value;

            const filtered = patientsData.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search) || p.date.includes(search);
                const matchesFilter = filter ? p.doctorType === filter : true;
                return matchesSearch && matchesFilter;
            });

            table.innerHTML = "";
            filtered.forEach(p => {
                table.innerHTML += `
                    <tr>
                        <td>${p.date}</td>
                        <td>${p.name}</td>
                        <td>${p.address}</td>
                        <td>${p.age}</td>
                        <td>${p.contact}</td>
                        <td>${p.sick || ""}</td>
                        <td>${p.doctorName}</td>
                        <td>${p.doctorType}</td>
                        <td>
                            <button class="edit-btn" onclick="editPatient('${p.id}')">Edit</button>
                            <button class="delete-btn" onclick="deletePatient('${p.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // ================= DELETE =================
        window.deletePatient = async function (id) {
            if (confirm("Are you sure you want to delete this record?")) {
                try {
                    await deleteDoc(doc(db, "patients", id));
                } catch (error) {
                    console.error("Error deleting patient:", error);
                }
            }
        };

        // ================= EDIT =================
        window.editPatient = function (id) {
            editId = id;
            const patient = patientsData.find(p => p.id === id);
            if (!patient) return;

            document.getElementById("date").value = patient.date;
            document.getElementById("name").value = patient.name;
            document.getElementById("address").value = patient.address;

            const ageParts = patient.age.match(/(\d+)\s*yr\s*(\d+)\s*mo/);
            if (ageParts) {
                document.getElementById("ageYears").value = ageParts[1];
                document.getElementById("ageMonths").value = ageParts[2];
            }

            document.getElementById("contact").value = patient.contact;
            document.getElementById("sick").value = patient.sick || "";
            document.getElementById("doctorName").value = patient.doctorName;
            document.getElementById("doctorType").value = patient.doctorType;
        };

    </script>

</body>
</html>
