<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinika ni San Nicolas Patient Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f6f9;
        }
        
        h2 {
            text-align: center;
        }
        
        input {
            padding: 8px;
            margin: 5px;
            width: 18%;
        }
        
        button {
            padding: 8px 15px;
            background: #2e86de;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }
        
        th,
        td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        
        th {
            background: #2e86de;
            color: white;
        }
        
        .delete-btn {
            background: red;
        }
    </style>
</head>

<body>

    <h2>KLINIKA NI SAN NICOLAS PATIENT RECORDS</h2>

    <input type="date" id="date">
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="address" placeholder="Address">
    <input type="number" id="ageYears" placeholder="Years" min="0">
    <input type="number" id="ageMonths" placeholder="Months" min="0" max="11">
    <input type="text" id="contact" placeholder="Contact">
    <input type="text" id="sick" placeholder="Sickness (Optional)">
    <button onclick="addPatient()">Add Record</button>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Address</th>
                <th>Age</th>
                <th>Contact</th>
                <th>Sickness</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="patientTable"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; // 🔹 Firebase Config
        const firebaseConfig = { apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos", authDomain: "klinika-ni-san-nicolas.firebaseapp.com", projectId: "klinika-ni-san-nicolas", storageBucket: "klinika-ni-san-nicolas.firebasestorage.app", messagingSenderId:
        "247172585082", appId: "1:247172585082:web:231c83f07b83767e840dc3", measurementId: "G-V3PHE6KYDF" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); const table = document.getElementById("patientTable"); // =================
        ADD PATIENT ================= window.addPatient = async function () { const years = document.getElementById("ageYears").value; const months = document.getElementById("ageMonths").value; const patient = { date: document.getElementById("date").value,
        name: document.getElementById("name").value, address: document.getElementById("address").value, age: years + " yr " + months + " mo", contact: document.getElementById("contact").value, sick: document.getElementById("sick").value }; if (!patient.date
        || !patient.name || !patient.address || !years || !months || !patient.contact) { alert("Please fill all required fields"); return; } try { await addDoc(collection(db, "patients"), patient); document.querySelectorAll("input").forEach(input => input.value
        = ""); } catch (error) { console.error("Error adding patient:", error); alert("Failed to add patient. Check console for errors."); } }; // ================= DISPLAY DATA ================= onSnapshot(collection(db, "patients"), (snapshot) => {
        table.innerHTML = ""; snapshot.forEach((docSnap) => { const data = docSnap.data(); table.innerHTML += `
        <tr>
            <td>${data.date}</td>
            <td>${data.name}</td>
            <td>${data.address}</td>
            <td>${data.age}</td>
            <td>${data.contact}</td>
            <td>${data.sick || ""}</td>
            <td>
                <button class="delete-btn" onclick="deletePatient('${docSnap.id}')">Delete</button>
            </td>
        </tr>
        `; }); }); // ================= DELETE ================= window.deletePatient = async function (id) { try { await deleteDoc(doc(db, "patients", id)); } catch (error) { console.error("Error deleting patient:", error); } };
    </script>

</body>

</html>
