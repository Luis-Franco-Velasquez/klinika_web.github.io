<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Klinika ni San Nicolas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f8f9fa; display:flex; justify-content:center; align-items:center; height:100vh; }
.card { width:100%; max-width:400px; padding:20px; }
#loginAlert { display:none; }
</style>
</head>
<body>

<div class="card shadow">
<h3 class="text-center mb-3">Login</h3>
<div id="loginAlert" class="alert alert-danger"></div>

<form id="loginForm">
<div class="mb-3"><input type="email" id="email" class="form-control" placeholder="Email" required></div>
<div class="mb-3"><input type="password" id="password" class="form-control" placeholder="Password" required></div>
<div class="d-grid gap-2">
<button type="submit" class="btn btn-primary">Login</button>
</div>
</form>

<div class="mt-3 text-center text-muted">
Test account: <br>
Email: <strong>admin@test.com</strong><br>
Password: <strong>123456</strong>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// --- Firebase Config ---
const firebaseConfig = { /* YOUR CONFIG HERE */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// --- Redirect if already logged in ---
onAuthStateChanged(auth, user => {
    if(user) window.location.href = "main.html";
});

// --- Optional: Create test admin if it doesn't exist ---
const testEmail = "admin@test.com";
const testPass = "123456";

async function createTestAdmin(){
    try {
        await createUserWithEmailAndPassword(auth, testEmail, testPass);
        console.log("Test admin account created!");
    } catch(e){
        if(e.code !== "auth/email-already-in-use") console.error(e);
    }
}
createTestAdmin();

// --- Login form ---
const form = document.getElementById("loginForm");
const alertBox = document.getElementById("loginAlert");

form.addEventListener("submit", async e=>{
    e.preventDefault();
    alertBox.style.display = "none";
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        await signInWithEmailAndPassword(auth,email,password);
        window.location.href = "main.html";
    } catch(err){
        alertBox.textContent = err.message;
        alertBox.style.display = "block";
    }
});
</script>

</body>
</html>
