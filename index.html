<!DOCTYPE html>
<html>

<head>
    <title>Klinika ni San Nicolas</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f6f9;
        }
        
        h2 {
            text-align: center;
        }
        
        input {
            padding: 8px;
            margin: 5px;
            width: 18%;
        }
        
        button {
            padding: 8px 15px;
            background: #2e86de;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }
        
        th,
        td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        
        th {
            background: #2e86de;
            color: white;
        }
        
        .delete-btn {
            background: red;
        }
    </style>
</head>

<body>

    <h2>KLINIKA NI SAN NICOLAS</h2>

    <input type="date" id="date">
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="address" placeholder="Address">
    <input type="number" id="age" placeholder="Age">
    <input type="text" id="contact" placeholder="Contact">
    <input type="text" id="sick" placeholder="Sickness (Optional)">
    <button onclick="addPatient()">Add Record</button>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Address</th>
                <th>Age</th>
                <th>Contact</th>
                <th>Sickness</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="patientTable"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; // 🔴 PASTE YOUR
        FIREBASE CONFIG HERE const firebaseConfig = { apiKey: "PASTE_YOURS", authDomain: "PASTE_YOURS", projectId: "PASTE_YOURS", storageBucket: "PASTE_YOURS", messagingSenderId: "PASTE_YOURS", appId: "PASTE_YOURS" }; const app = initializeApp(firebaseConfig);
        const db = getFirestore(app); const table = document.getElementById("patientTable"); window.addPatient = async function() { const patient = { date: document.getElementById("date").value, name: document.getElementById("name").value, address: document.getElementById("address").value,
        age: document.getElementById("age").value, contact: document.getElementById("contact").value, sick: document.getElementById("sick").value }; if (!patient.date || !patient.name || !patient.address || !patient.age || !patient.contact) { alert("Please
        fill all required fields"); return; } await addDoc(collection(db, "patients"), patient); document.querySelectorAll("input").forEach(input => input.value = ""); } onSnapshot(collection(db, "patients"), (snapshot) => { table.innerHTML = ""; snapshot.forEach((docSnap)
        => { const data = docSnap.data(); table.innerHTML += `
        <tr>
            <td>${data.date}</td>
            <td>${data.name}</td>
            <td>${data.address}</td>
            <td>${data.age}</td>
            <td>${data.contact}</td>
            <td>${data.sick || ""}</td>
            <td>
                <button class="delete-btn" onclick="deletePatient('${docSnap.id}')">Delete</button>
            </td>
        </tr>
        `; }); }); window.deletePatient = async function(id) { await deleteDoc(doc(db, "patients", id)); }

    </script>

</body>

</html>
