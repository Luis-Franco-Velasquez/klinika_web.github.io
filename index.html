<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinika ni San Nicolas Patient Records</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-edit {
            background-color: orange;
            color: white;
        }

        .btn-cancel {
            background-color: gray;
            color: white;
        }

        table th,
        table td {
            text-align: center;
        }

        .filter-search h5 {
            margin-bottom: 10px;
        }

        #btnCancelEdit {
            display: none;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-4">
        <h2 class="text-center mb-4">KLINIKA NI SAN NICOLAS PATIENT RECORDS</h2>

        <!-- FORM -->
        <form id="patientForm" class="row g-3 mb-4">
            <div class="col-12 col-md-3">
                <input type="date" id="date" class="form-control" placeholder="Date">
            </div>
            <div class="col-12 col-md-3">
                <input type="text" id="name" class="form-control" placeholder="Full Name">
            </div>
            <div class="col-12 col-md-3">
                <input type="text" id="address" class="form-control" placeholder="Address">
            </div>
            <div class="col-6 col-md-1">
                <input type="number" id="ageYears" class="form-control" placeholder="Years" min="0">
            </div>
            <div class="col-6 col-md-1">
                <input type="number" id="ageMonths" class="form-control" placeholder="Months" min="0" max="11">
            </div>
            <div class="col-12 col-md-3">
                <input type="text" id="contact" class="form-control" placeholder="Contact">
            </div>
            <div class="col-12 col-md-3">
                <input type="text" id="sick" class="form-control" placeholder="Sickness (Optional)">
            </div>
            <div class="col-12 col-md-3">
                <input type="text" id="doctorName" class="form-control" placeholder="Doctor Name">
            </div>
            <div class="col-12 col-md-3">
                <select id="doctorType" class="form-select">
                    <option value="">Select Type</option>
                    <option value="Pedia">Pedia</option>
                    <option value="Adult">Adult</option>
                </select>
            </div>
            <div class="col-12 col-md-auto d-flex gap-2 align-items-start">
                <button type="button" class="btn btn-primary" onclick="addPatient()">Add Record</button>
                <button type="button" id="btnCancelEdit" class="btn btn-cancel" onclick="cancelEdit()">Cancel Edit</button>
            </div>
        </form>

        <!-- SEARCH / FILTER -->
        <div class="filter-search row mb-3 align-items-center">
            <h5 class="col-12">Search / Filter</h5>
            <div class="col-12 col-md-4 mb-2 mb-md-0 d-flex">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by Name or Date">
                <button type="button" class="btn btn-primary ms-2" onclick="renderFiltered()">Search</button>
            </div>
            <div class="col-12 col-md-4">
                <select id="filterType" class="form-select" onchange="renderFiltered()">
                    <option value="">All Doctors</option>
                    <option value="Pedia">Pedia</option>
                    <option value="Adult">Adult</option>
                </select>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped bg-white">
                <thead class="table-primary">
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Age</th>
                        <th>Contact</th>
                        <th>Sickness</th>
                        <th>Doctor</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="patientTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Firebase + JS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
            authDomain: "klinika-ni-san-nicolas.firebaseapp.com",
            projectId: "klinika-ni-san-nicolas",
            storageBucket: "klinika-ni-san-nicolas.firebasestorage.app",
            messagingSenderId: "247172585082",
            appId: "1:247172585082:web:231c83f07b83767e840dc3",
            measurementId: "G-V3PHE6KYDF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const table = document.getElementById("patientTable");
        const btnCancelEdit = document.getElementById("btnCancelEdit");

        let editId = null;
        let patientsData = [];

        // ADD / UPDATE PATIENT
        window.addPatient = async function () {
            const years = document.getElementById("ageYears").value;
            const months = document.getElementById("ageMonths").value;
            const doctorName = document.getElementById("doctorName").value;
            const doctorType = document.getElementById("doctorType").value;

            const patient = {
                date: document.getElementById("date").value,
                name: document.getElementById("name").value,
                address: document.getElementById("address").value,
                age: years + " yr " + months + " mo",
                contact: document.getElementById("contact").value,
                sick: document.getElementById("sick").value,
                doctorName: doctorName,
                doctorType: doctorType
            };

            if (!patient.date || !patient.name || !patient.address || !years || !months || !patient.contact || !doctorName || !doctorType) {
                alert("Please fill all required fields including doctor info");
                return;
            }

            try {
                if (editId) {
                    if (confirm("Are you sure you want to update this record?")) {
                        await updateDoc(doc(db, "patients", editId), patient);
                        editId = null;
                        btnCancelEdit.style.display = "none";
                    }
                } else {
                    await addDoc(collection(db, "patients"), patient);
                }
                clearForm();
            } catch (error) {
                console.error("Error adding/updating patient:", error);
                alert("Failed. Check console for errors.");
            }
        };

        function clearForm() {
            editId = null;
            document.querySelectorAll("input, select").forEach(input => input.value = "");
            btnCancelEdit.style.display = "none";
        }
        window.cancelEdit = clearForm;

        // DISPLAY PATIENTS
        onSnapshot(collection(db, "patients"), (snapshot) => {
            patientsData = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                patientsData.push({ id: docSnap.id, ...data });
            });
            renderFiltered();
        });

        // FORMAT DATE FOR FLEXIBLE SEARCH
        function formatDateForSearch(dateStr) {
            if (!dateStr) return {};
            const d = new Date(dateStr);
            const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const mm = String(d.getMonth() + 1).padStart(2,'0');
            const dd = String(d.getDate()).padStart(2,'0');
            const yyyy = d.getFullYear();
            const shortMonth = monthNames[d.getMonth()];
            return {
                ymd: `${yyyy}-${mm}-${dd}`,
                md: `${mm}-${dd}`,
                short: `${shortMonth} ${dd}`,
                slash: `${d.getMonth()+1}/${dd}`
            };
        }

        // FILTER + SEARCH
        function renderFiltered() {
            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const filter = document.getElementById("filterType").value.toLowerCase();

            const filtered = patientsData.filter(p => {
                const name = p.name.toLowerCase();
                const dateFormats = formatDateForSearch(p.date);

                const matchesSearch = search === "" || 
                    name.includes(search) || 
                    (dateFormats.ymd && dateFormats.ymd.includes(search)) ||
                    (dateFormats.md && dateFormats.md.includes(search)) ||
                    (dateFormats.short && dateFormats.short.toLowerCase().includes(search)) ||
                    (dateFormats.slash && dateFormats.slash.includes(search));

                const matchesFilter = filter === "" || p.doctorType.toLowerCase() === filter;

                return matchesSearch && matchesFilter;
            });

            table.innerHTML = "";
            filtered.forEach(p => {
                table.innerHTML += `
                    <tr>
                        <td>${p.date}</td>
                        <td>${p.name}</td>
                        <td>${p.address}</td>
                        <td>${p.age}</td>
                        <td>${p.contact}</td>
                        <td>${p.sick || ""}</td>
                        <td>${p.doctorName}</td>
                        <td>${p.doctorType}</td>
                        <td>
                            <button class="btn btn-edit btn-sm" onclick="editPatient('${p.id}')">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePatient('${p.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // DELETE
        window.deletePatient = async function (id) {
            if (confirm("Are you sure you want to delete this record?")) {
                try {
                    await deleteDoc(doc(db, "patients", id));
                } catch (error) {
                    console.error("Error deleting patient:", error);
                }
            }
        };

        // EDIT
        window.editPatient = function (id) {
            editId = id;
            btnCancelEdit.style.display = "inline-block"; // show cancel button
            const patient = patientsData.find(p => p.id === id);
            if (!patient) return;

            document.getElementById("date").value = patient.date;
            document.getElementById("name").value = patient.name;
            document.getElementById("address").value = patient.address;

            const ageParts = patient.age.match(/(\d+)\s*yr\s*(\d+)\s*mo/);
            if (ageParts) {
                document.getElementById("ageYears").value = ageParts[1];
                document.getElementById("ageMonths").value = ageParts[2];
            }

            document.getElementById("contact").value = patient.contact;
            document.getElementById("sick").value = patient.sick || "";
            document.getElementById("doctorName").value = patient.doctorName;
            document.getElementById("doctorType").value = patient.doctorType;
        };

        // SEARCH ENTER KEY
        document.getElementById("searchInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                renderFiltered();
            }
        });
    </script>

</body>
</html>
