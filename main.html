<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klinika ni San Nicolas - Patient Records</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body.dark-mode{background:#121212!important;color:white!important;}
.dark-mode .table{color:white;}
.dark-mode .table-striped tbody tr:nth-of-type(odd){background:#1f1f1f;}
.dark-mode .form-control,.dark-mode .form-select{background:#2a2a2a;color:white;border-color:#444;}
.btn-edit{background:orange;color:white;}
.btn-cancel{background:gray;color:white;}
#btnCancelEdit{display:none;}
#successAlert{display:none;opacity:0;transition:.3s;}
</style>
</head>

<body class="bg-light">

<div class="container py-4">

<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-3">
<h2>KLINIKA NI SAN NICOLAS PATIENT RECORDS</h2>
<div>

<a href="https://luis-franco-velasquez.github.io/Medicine-Inventory/index.html"
   target="_blank"
   class="btn btn-success me-2">
   💊 Medicine Inventory
</a>

<button class="btn btn-dark me-2" onclick="toggleDarkMode()">🌙 Dark Mode</button>
<button class="btn btn-danger" onclick="logout()">Logout</button>

</div>
</div>

<h5>Total Records: <span id="recordCount">0</span></h5>
<div id="successAlert" class="alert alert-success text-center py-2"></div>

<!-- FORM -->
<form id="patientForm" class="row g-3 mb-4">

<div class="col-md-3"><input type="date" id="date" class="form-control" required></div>
<div class="col-md-3"><input type="text" id="name" class="form-control" placeholder="Full Name" required></div>
<div class="col-md-3"><input type="text" id="address" class="form-control" placeholder="Address" required></div>
<div class="col-md-1"><input type="number" id="ageYears" class="form-control" placeholder="Yr" min="0" required></div>
<div class="col-md-1"><input type="number" id="ageMonths" class="form-control" placeholder="Mo" min="0" max="11" required></div>
<div class="col-md-3"><input type="text" id="contact" class="form-control" placeholder="Contact" required></div>
<div class="col-md-3"><input type="text" id="sick" class="form-control" placeholder="Sickness"></div>
<div class="col-md-3"><input type="text" id="doctorName" class="form-control" placeholder="Doctor Name" required></div>

<div class="col-md-3">
<select id="doctorType" class="form-select" required>
<option value="">Select Type</option>
<option value="Pedia">Pedia</option>
<option value="Adult">Adult</option>
</select>
</div>

<div class="col-auto d-flex gap-2">
<button type="submit" class="btn btn-primary">Add Record</button>
<button type="button" id="btnCancelEdit" class="btn btn-cancel" onclick="cancelEdit()">Cancel</button>
</div>

</form>

<!-- FILTERS -->
<div class="row mb-3 g-2">

<div class="col-md-3">
<input type="text" id="searchInput" class="form-control" placeholder="Search Name or Date">
</div>

<div class="col-md-2">
<select id="filterType" class="form-select">
<option value="">All Doctors</option>
<option value="Pedia">Pedia</option>
<option value="Adult">Adult</option>
</select>
</div>

<div class="col-md-2">
<select id="filterMonth" class="form-select">
<option value="">All Months</option>
</select>
</div>

<div class="col-md-2">
<select id="filterYear" class="form-select">
<option value="">All Years</option>
</select>
</div>

<div class="col-md-2">
<select id="sortOption" class="form-select">
<option value="">No Sorting</option>
<option value="firstAZ">First Name A-Z</option>
<option value="lastAZ">Last Name A-Z</option>
</select>
</div>

<div class="col-md-2 d-flex gap-2">
<button class="btn btn-success" onclick="exportToExcel()">Excel</button>
<button class="btn btn-warning" onclick="backupData()">Backup</button>
</div>

</div>

<!-- TABLE -->
<div class="table-responsive">
<table class="table table-bordered table-striped bg-white">
<thead class="table-primary">
<tr>
<th>Date</th>
<th>Name</th>
<th>Address</th>
<th>Age</th>
<th>Contact</th>
<th>Sickness</th>
<th>Doctor</th>
<th>Type</th>
<th>Action</th>
</tr>
</thead>
<tbody id="patientTable"></tbody>
</table>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
  authDomain: "klinika-ni-san-nicolas.firebaseapp.com",
  projectId: "klinika-ni-san-nicolas",
  storageBucket: "klinika-ni-san-nicolas.firebasestorage.app",
  messagingSenderId: "247172585082",
  appId: "1:247172585082:web:231c83f07b83767e840dc3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ================= AUTH PROTECTION ================= */
onAuthStateChanged(auth,user=>{
  if(!user) window.location.href="index.html";
});

window.logout = async()=>{
  await signOut(auth);
  window.location.href="index.html";
};

/* ================= VARIABLES ================= */
let editId=null;
let patientsData=[];

const table=document.getElementById("patientTable");
const form=document.getElementById("patientForm");
const btnCancel=document.getElementById("btnCancelEdit");

/* ================= ADD / UPDATE ================= */
form.addEventListener("submit",async e=>{
e.preventDefault();

const patient={
date:date.value,
name:name.value,
address:address.value,
age:ageYears.value+" yr "+ageMonths.value+" mo",
contact:contact.value,
sick:sick.value,
doctorName:doctorName.value,
doctorType:doctorType.value
};

if(editId){
  await updateDoc(doc(db,"patients",editId),patient);
}else{
  await addDoc(collection(db,"patients"),patient);
}

clearForm();
});

function clearForm(){
editId=null;
form.reset();
btnCancel.style.display="none";
}

window.cancelEdit=clearForm;

/* ================= REALTIME LISTENER ================= */
onSnapshot(collection(db,"patients"),snap=>{
patientsData=[];
snap.forEach(d=>patientsData.push({id:d.id,...d.data()}));
renderFiltered();
});

/* ================= RENDER ================= */
function renderFiltered(){

let filtered=[...patientsData];

let search=searchInput.value?.toLowerCase()||"";
filtered=filtered.filter(p=>
p.name.toLowerCase().includes(search)||
p.date.includes(search)
);

if(filterType.value)
filtered=filtered.filter(p=>p.doctorType===filterType.value);

if(sortOption.value==="firstAZ")
filtered.sort((a,b)=>a.name.localeCompare(b.name));

if(sortOption.value==="lastAZ")
filtered.sort((a,b)=>{
let la=a.name.split(" ").pop();
let lb=b.name.split(" ").pop();
return la.localeCompare(lb);
});

table.innerHTML="";
filtered.forEach(p=>{
table.innerHTML+=`
<tr>
<td>${p.date}</td>
<td>${p.name}</td>
<td>${p.address}</td>
<td>${p.age}</td>
<td>${p.contact}</td>
<td>${p.sick||""}</td>
<td>${p.doctorName}</td>
<td>${p.doctorType}</td>
<td>
<button class="btn btn-edit btn-sm" onclick="editPatient('${p.id}')">Edit</button>
<button class="btn btn-danger btn-sm" onclick="deletePatient('${p.id}')">Delete</button>
</td>
</tr>
`;
});

document.getElementById("recordCount").textContent=filtered.length;
}

window.editPatient=id=>{
editId=id;
btnCancel.style.display="inline-block";
let p=patientsData.find(x=>x.id===id);
date.value=p.date;
name.value=p.name;
address.value=p.address;
let parts=p.age.match(/\d+/g);
ageYears.value=parts[0];
ageMonths.value=parts[1];
contact.value=p.contact;
sick.value=p.sick;
doctorName.value=p.doctorName;
doctorType.value=p.doctorType;
};

window.deletePatient=async id=>{
if(confirm("Delete record?"))
await deleteDoc(doc(db,"patients",id));
};

/* ================= EXPORT ================= */
window.exportToExcel=function(){
let html="<table border='1'>"+table.innerHTML+"</table>";
let blob=new Blob([html],{type:"application/vnd.ms-excel"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Patient_Records.xls";
a.click();
};

/* ================= BACKUP ================= */
window.backupData=async function(){
let snap=await getDocs(collection(db,"patients"));
let data=[];
snap.forEach(d=>data.push({id:d.id,...d.data()}));
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Backup_"+new Date().toISOString().replace(/[:T]/g,"-")+".json";
a.click();
};

/* ================= DARK MODE ================= */
window.toggleDarkMode=function(){
document.body.classList.toggle("dark-mode");
};

</script>
</body>
</html>
