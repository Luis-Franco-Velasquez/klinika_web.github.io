<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klinika ni San Nicolas Patient Records</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body.dark-mode { background:#121212 !important; color:white !important; }
.dark-mode .table { color:white; }
.dark-mode .table-striped tbody tr:nth-of-type(odd){ background:#1f1f1f; }
.dark-mode .form-control, .dark-mode .form-select{ background:#2a2a2a; color:white; border-color:#444; }
.btn-edit{background:orange;color:white;}
.btn-cancel{background:gray;color:white;}
#btnCancelEdit{display:none;}
#successAlert{display:none;opacity:0;transition:.3s;}
</style>
</head>
<body class="bg-light">

<div class="container py-4 position-relative" style="display:none;">
<!-- Dark mode toggle -->
<button class="btn btn-dark position-absolute top-0 end-0" onclick="toggleDarkMode()">🌙</button>
<!-- Logout -->
<button class="btn btn-danger position-absolute top-0 end-5" onclick="logout()">Logout</button>

<h2 class="text-center mb-2">KLINIKA NI SAN NICOLAS PATIENT RECORDS</h2>
<h5 class="text-center mb-2">Total Records: <span id="recordCount">0</span></h5>

<div id="successAlert" class="alert alert-success text-center py-2"></div>

<!-- Patient Form -->
<form id="patientForm" class="row g-3 mb-4">
<!-- Inputs: date, name, address, ageYears, ageMonths, contact, sick, doctorName, doctorType -->
<div class="col-md-3"><input type="date" id="date" class="form-control" required></div>
<div class="col-md-3"><input type="text" id="name" class="form-control" placeholder="Full Name" required></div>
<div class="col-md-3"><input type="text" id="address" class="form-control" placeholder="Address" required></div>
<div class="col-md-1"><input type="number" id="ageYears" class="form-control" placeholder="Yr" min="0" required></div>
<div class="col-md-1"><input type="number" id="ageMonths" class="form-control" placeholder="Mo" min="0" max="11" required></div>
<div class="col-md-3"><input type="text" id="contact" class="form-control" placeholder="Contact" required></div>
<div class="col-md-3"><input type="text" id="sick" class="form-control" placeholder="Sickness"></div>
<div class="col-md-3"><input type="text" id="doctorName" class="form-control" placeholder="Doctor Name" required></div>
<div class="col-md-3">
<select id="doctorType" class="form-select" required>
<option value="">Select Type</option>
<option value="Pedia">Pedia</option>
<option value="Adult">Adult</option>
</select>
</div>
<div class="col-auto d-flex gap-2">
<button type="submit" class="btn btn-primary">Add Record</button>
<button type="button" id="btnCancelEdit" class="btn btn-cancel" onclick="cancelEdit()">Cancel</button>
</div>
</form>

<!-- Filters + Buttons -->
<div class="row mb-3 g-2">
<div class="col-md-3"><input type="text" id="searchInput" class="form-control" placeholder="Search Name or Date"></div>
<div class="col-md-2">
<select id="filterType" class="form-select">
<option value="">All Doctors</option>
<option value="Pedia">Pedia</option>
<option value="Adult">Adult</option>
</select>
</div>
<div class="col-md-2">
<select id="filterMonth" class="form-select">
<option value="">All Months</option>
<option value="0">Jan</option>
<option value="1">Feb</option>
<option value="2">Mar</option>
<option value="3">Apr</option>
<option value="4">May</option>
<option value="5">Jun</option>
<option value="6">Jul</option>
<option value="7">Aug</option>
<option value="8">Sep</option>
<option value="9">Oct</option>
<option value="10">Nov</option>
<option value="11">Dec</option>
</select>
</div>
<div class="col-md-2">
<select id="filterYear" class="form-select"><option value="">All Years</option></select>
</div>
<div class="col-md-2">
<select id="sortOption" class="form-select">
<option value="">No Sorting</option>
<option value="firstAZ">First Name A-Z</option>
<option value="lastAZ">Last Name A-Z</option>
</select>
</div>
<div class="col-md-2 d-flex gap-2">
<button class="btn btn-success" onclick="exportToExcel()">Excel</button>
<button class="btn btn-warning" onclick="backupData()">Backup</button>
</div>
</div>

<!-- Table -->
<div class="table-responsive">
<table class="table table-bordered table-striped bg-white">
<thead class="table-primary">
<tr>
<th>Date</th><th>Name</th><th>Address</th><th>Age</th>
<th>Contact</th><th>Sickness</th>
<th>Doctor</th><th>Type</th><th>Action</th>
</tr>
</thead>
<tbody id="patientTable"></tbody>
</table>
</div>

<!-- Sounds -->
<audio id="addSound" preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4011f5b55c.mp3?filename=success-1-6297.mp3">
</audio>
<audio id="editSound" preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c1c6c8cdd2.mp3?filename=click-124467.mp3">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
authDomain:"klinika-ni-san-nicolas.firebaseapp.com",
projectId:"klinika-ni-san-nicolas",
storageBucket:"klinika-ni-san-nicolas.firebasestorage.app",
messagingSenderId:"247172585082",
appId:"1:247172585082:web:231c83f07b83767e840dc3",
measurementId:"G-V3PHE6KYDF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let editId=null, patientsData=[];
const table=document.getElementById("patientTable");
const form=document.getElementById("patientForm");
const btnCancel=document.getElementById("btnCancelEdit");
const container=document.querySelector(".container");

const addSound=document.getElementById("addSound");
const editSound=document.getElementById("editSound");
const recordCount=document.getElementById("recordCount");
const successAlert=document.getElementById("successAlert");

// Show page only if logged in
onAuthStateChanged(auth,user=>{
if(user) container.style.display="block";
else window.location.href="index.html";
});

// Logout
window.logout=async()=>{ await signOut(auth); window.location.href="index.html"; };

// Add/Edit Patient
form.addEventListener("submit",async e=>{
e.preventDefault();
const patient={
date:date.value,
name:name.value,
address:address.value,
age:ageYears.value+" yr "+ageMonths.value+" mo",
contact:contact.value,
sick:sick.value,
doctorName:doctorName.value,
doctorType:doctorType.value
};
if(editId){
await updateDoc(doc(db,"patients",editId),patient);
showSuccess(true);
}else{
await addDoc(collection(db,"patients"),patient);
showSuccess(false);
}
clearForm();
});

// Cancel Edit
window.cancelEdit=()=>{ editId=null; form.reset(); btnCancel.style.display="none"; date.focus(); };

// Fetch Patients
onSnapshot(collection(db,"patients"),snap=>{
patientsData=[];
snap.forEach(d=>patientsData.push({id:d.id,...d.data()}));
populateYear();
renderFiltered();
});

// Populate Year filter
function populateYear(){
let years=[...new Set(patientsData.map(p=>new Date(p.date).getFullYear()))];
filterYear.innerHTML='<option value="">All Years</option>';
years.sort((a,b)=>b-a).forEach(y=>{filterYear.innerHTML+=`<option value="${y}">${y}</option>`;});
}

// Filters
searchInput.addEventListener("input",renderFiltered);
filterType.addEventListener("change",renderFiltered);
filterMonth.addEventListener("change",renderFiltered);
filterYear.addEventListener("change",renderFiltered);
sortOption.addEventListener("change",renderFiltered);

// Auto-next input for age
ageYears.addEventListener("input",()=>{ if(ageYears.value.length>=2) ageMonths.focus(); });
ageMonths.addEventListener("input",()=>{ if(ageMonths.value.length>=2) contact.focus(); });

// Shift+Enter move next field
form.addEventListener("keydown",e=>{
if(e.key==="Enter"&&e.shiftKey){
e.preventDefault();
const inputs=[...form.querySelectorAll("input,select")];
let i=inputs.indexOf(document.activeElement);
if(i>-1&&i<inputs.length-1) inputs[i+1].focus();
}
});

// Render filtered patients
function renderFiltered(){
let filtered=patientsData.filter(p=>{
let search=searchInput.value.toLowerCase();
let nameMatch=p.name.toLowerCase().includes(search);
let typeMatch=!filterType.value||p.doctorType===filterType.value;
let d=new Date(p.date);
let monthMatch=!filterMonth.value||d.getMonth()==filterMonth.value;
let yearMatch=!filterYear.value||d.getFullYear()==filterYear.value;
return nameMatch&&typeMatch&&monthMatch&&yearMatch;
});
if(sortOption.value==="firstAZ") filtered.sort((a,b)=>a.name.split(" ")[0].localeCompare(b.name.split(" ")[0]));
if(sortOption.value==="lastAZ") filtered.sort((a,b)=>{let la=a.name.split(" ").pop(); let lb=b.name.split(" ").pop(); return la.localeCompare(lb);});
table.innerHTML="";
filtered.forEach(p=>{
table.innerHTML+=`<tr>
<td>${p.date}</td>
<td>${p.name}</td>
<td>${p.address}</td>
<td>${p.age}</td>
<td>${p.contact}</td>
<td>${p.sick||""}</td>
<td>${p.doctorName}</td>
<td>${p.doctorType}</td>
<td>
<button class="btn btn-edit btn-sm" onclick="editPatient('${p.id}')">Edit</button>
<button class="btn btn-danger btn-sm" onclick="deletePatient('${p.id}')">Delete</button>
</td>
</tr>`;
});
animateCounter(filtered.length);
}

// Edit & Delete
window.editPatient=id=>{
editId=id; btnCancel.style.display="inline-block";
let p=patientsData.find(x=>x.id===id);
date.value=p.date; name.value=p.name; address.value=p.address;
let parts=p.age.match(/(\d+)/g); ageYears.value=parts[0]; ageMonths.value=parts[1];
contact.value=p.contact; sick.value=p.sick; doctorName.value=p.doctorName; doctorType.value=p.doctorType;
};
window.deletePatient=async id=>{ if(confirm("Delete record?")) await deleteDoc(doc(db,"patients",id)); };

// Success alert
function showSuccess(isEdit){
successAlert.innerHTML=isEdit?"✔ Record Updated":"✔ Record Saved";
successAlert.style.display="block";
successAlert.style.opacity="1";
(isEdit?editSound:addSound).play();
setTimeout(()=>{successAlert.style.opacity="0"; setTimeout(()=>successAlert.style.display="none",300);},1500);
}

// Animate counter
function animateCounter(n){ let c=recordCount; let start=0; let interval=setInterval(()=>{start++; c.textContent=start; if(start>=n)clearInterval(interval);},20); }

// Export to Excel
window.exportToExcel=function(){ let html="<table border='1'>"+patientTable.innerHTML+"</table>"; let blob=new Blob([html],{type:"application/vnd.ms-excel"}); let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Patient_Records.xls"; a.click(); };

// Backup JSON
window.backupData=async function(){ let snap=await getDocs(collection(db,"patients")); let data=[]; snap.forEach(d=>data.push({id:d.id,...d.data()})); let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Backup_"+new Date().toISOString().replace(/[:T]/g,"-")+".json"; a.click(); };

// Dark mode toggle
window.toggleDarkMode=()=>{ document.body.classList.toggle("dark-mode"); };
</script>

</body>
</html>
