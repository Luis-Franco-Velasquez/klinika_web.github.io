<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Create Admin Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width:350px;">
        <h4 class="text-center mb-3">Create Admin</h4>

        <input type="email" id="email" class="form-control mb-2" placeholder="Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-success w-100" onclick="register()">Register</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"; // 🔹 REPLACE THIS WITH YOUR FIREBASE CONFIG
        const firebaseConfig = { apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos", authDomain: "klinika-ni-san-nicolas.firebaseapp.com", projectId: "klinika-ni-san-nicolas", storageBucket: "klinika-ni-san-nicolas.appspot.com", messagingSenderId: "247172585082",
        appId: "1:247172585082:web:231c83f07b83767e840dc3", measurementId: "G-V3PHE6KYDF" }; const app = initializeApp(firebaseConfig); const auth = getAuth(app); window.register = async function() { try { await createUserWithEmailAndPassword(auth, email.value,
        password.value); alert("Admin account created successfully! Now login."); window.location.href = "login.html"; } catch(err) { alert(err.message); } }
    </script>

</body>

</html>
