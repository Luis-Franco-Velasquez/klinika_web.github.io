<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clinic Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px;">
  <h4 class="text-center mb-3">Clinic Login</h4>

  <input type="email" id="email" class="form-control mb-2" placeholder="Email">
  <input type="password" id="password" class="form-control mb-3" placeholder="Password">

  <button class="btn btn-primary w-100" onclick="login()">Login</button>
  <div id="error" class="text-danger mt-2 text-center"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzmst_7XakIWC47G-XiI2wti3iJ6h1tos",
  authDomain: "klinika-ni-san-nicolas.firebaseapp.com",
  projectId: "klinika-ni-san-nicolas",
  storageBucket: "klinika-ni-san-nicolas.appspot.com",
  messagingSenderId: "247172585082",
  appId: "1:247172585082:web:231c83f07b83767e840dc3",
  measurementId: "G-V3PHE6KYDF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function() {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    window.location.href = "index.html"; // redirect to your main patient system
  } catch(err) {
    error.textContent = "Invalid email or password";
  }
}
</script>

</body>
</html>
